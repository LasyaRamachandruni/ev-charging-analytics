# Postgres + the pipeline + the API and web app.
#
#   docker compose up --build        # then open http://localhost:8000
#
# The `pipeline` service builds the warehouse from synthetic sessions and
# publishes it to Postgres, then exits. For real data, set ACN_API_TOKEN and
# change its command to: evcharge fetch ... && evcharge run && evcharge publish

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ev
      POSTGRES_PASSWORD: ev
      POSTGRES_DB: ev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ev"]
      interval: 3s
      retries: 20

  pipeline:
    build: .
    command: sh -c "evcharge run --synthetic --days 120 && evcharge publish"
    environment:
      EVCHARGE_PG_DSN: postgresql://ev:ev@postgres:5432/ev
      ACN_API_TOKEN: ${ACN_API_TOKEN:-}
    volumes:
      - data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment:
      EVCHARGE_PG_DSN: postgresql://ev:ev@postgres:5432/ev
    ports:
      - "8000:8000"
    depends_on:
      pipeline:
        condition: service_completed_successfully

volumes:
  pgdata:
  data:
