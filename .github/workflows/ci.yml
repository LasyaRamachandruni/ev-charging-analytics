name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit and pipeline tests (includes dbt build with data tests)
        run: pytest -q
      - name: Run the pipeline on synthetic data
        run: evcharge --data-dir /tmp/ev run --synthetic --inject-issues --out /tmp/ev/results
